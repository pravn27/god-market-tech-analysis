[project]
name = "data-jobs"
version = "0.1.0"
description = "Scheduled market-data jobs that persist bars and job progress in SQLite."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
data-jobs = "data_jobs.cli:run"

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_jobs"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests", "../src"]
testpaths = ["tests"]
