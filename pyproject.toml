[project]
name = "god-market-tech-analysis"
version = "0.1.0"
description = "Local, read-only multi-timeframe technical-analysis decision support."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "keyring>=25,<26",
    "mcp>=1.25,<2",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/god_market_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
